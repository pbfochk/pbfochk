<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#DDF4FF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Noto Serif SC', serif; }
    .star-a { animation: twinkle 2.8s ease-in-out infinite; }
    .star-b { animation: twinkle 3.7s 1.2s ease-in-out infinite; }
    .wind-a { stroke-dasharray:180; animation: drift 6s linear infinite; }
    .wind-b { stroke-dasharray:140; animation: drift 7.5s 1.5s linear infinite; }
    .moon { animation: breathe 5s ease-in-out infinite; transform-origin:720px 102px; }
    @keyframes twinkle { 0%,100% { opacity:.18 } 50% { opacity:1 } }
    @keyframes drift { from { stroke-dashoffset:320 } to { stroke-dashoffset:-320 } }
    @keyframes breathe { 0%,100% { transform:scale(.97); opacity:.86 } 50% { transform:scale(1.03); opacity:1 } }
  </style>
  <rect x="1" y="1" width="898" height="228" rx="14" fill="#0B0F16" stroke="#30363D" stroke-width="2"/>
  <circle cx="720" cy="102" r="95" fill="url(#halo)" class="moon"/>
  <circle cx="720" cy="102" r="38" fill="#E6EDF3" class="moon"/>
  <circle cx="736" cy="87" r="38" fill="#0B0F16"/>
  <circle cx="92" cy="54" r="2" fill="#A5D6FF" class="star-a"/>
  <circle cx="154" cy="91" r="1.5" fill="#E6EDF3" class="star-b"/>
  <circle cx="296" cy="49" r="1.5" fill="#A5D6FF" class="star-b"/>
  <circle cx="401" cy="78" r="2" fill="#E6EDF3" class="star-a"/>
  <circle cx="552" cy="43" r="1.5" fill="#A5D6FF" class="star-b"/>
  <path class="wind-a" d="M45 157C155 130 238 180 362 151C463 127 535 147 618 132" stroke="#58A6FF" stroke-opacity=".33" stroke-width="1.5" stroke-linecap="round"/>
  <path class="wind-b" d="M112 181C220 161 301 197 430 174C508 160 568 173 650 155" stroke="#7EE787" stroke-opacity=".2" stroke-width="1.2" stroke-linecap="round"/>
  <text x="450" y="111" text-anchor="middle" class="serif" font-size="25" letter-spacing="5" fill="#F0F6FC">今晚月色很美，风也温柔</text>
  <text x="450" y="141" text-anchor="middle" class="serif" font-size="11" letter-spacing="3" fill="#6E7681">THE MOON IS BEAUTIFUL TONIGHT</text>
</svg>
