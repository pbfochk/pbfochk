<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .signal { animation: pulse 3s ease-in-out infinite; }
    .scan { animation: scan 4.5s ease-in-out infinite; }
    .trace { stroke-dasharray: 260; animation: draw 5s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(-20px); opacity:0 } 15%,70% { opacity:.3 } 100% { transform:translateY(220px); opacity:0 } }
    @keyframes draw { 0% { stroke-dashoffset:260 } 45%,100% { stroke-dashoffset:0 } }
  </style>
  <rect x="1" y="1" width="898" height="258" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M1 48H899" stroke="#30363D"/>
  <circle cx="25" cy="24" r="6" fill="#FF5F56"/>
  <circle cx="47" cy="24" r="6" fill="#FFBD2E"/>
  <circle cx="69" cy="24" r="6" fill="#27C93F"/>
  <text x="450" y="29" text-anchor="middle" class="mono" font-size="13" fill="#6E7681">pbfochk@unknown: ~/mind</text>
  <text x="34" y="85" class="mono" font-size="15" fill="#7EE787">$ whoami --verbose</text>
  <text x="34" y="122" class="mono" font-size="30" font-weight="700" fill="#F0F6FC">PBFOCHK</text>
  <text x="34" y="151" class="mono" font-size="15" fill="#8B949E">security explorer / builder of thoughtful systems</text>
  <text x="34" y="195" class="mono" font-size="15" fill="#7EE787">$ current_process</text>
  <text x="205" y="195" class="mono" font-size="15" fill="#C9D1D9">thinking beyond the obvious</text>
  <rect x="459" y="181" width="9" height="18" rx="1" fill="#7EE787" class="cursor"/>
  <circle cx="837" cy="87" r="4" fill="#39D353" class="signal"/>
  <text x="854" y="92" class="mono" font-size="12" fill="#6E7681">ONLINE</text>
  <path class="trace" d="M666 210C700 168 728 221 757 173C781 134 804 187 836 145" stroke="#238636" stroke-width="2" stroke-linecap="round" opacity=".65"/>
  <path d="M666 221H866" stroke="#21262D"/>
  <rect class="scan" x="12" y="52" width="876" height="1" fill="#7EE787" opacity=".25"/>
</svg>
