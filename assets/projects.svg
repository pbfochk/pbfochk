<svg width="900" height="310" viewBox="0 0 900 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#238636"/><stop offset="1" stop-color="#1F6FEB"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .flow { stroke-dasharray:8 12; animation: flow 4s linear infinite; }
    .node1 { animation:pulse 4s 0s ease-in-out infinite; } .node2 { animation:pulse 4s 1s ease-in-out infinite; }
    .node3 { animation:pulse 4s 2s ease-in-out infinite; } .node4 { animation:pulse 4s 3s ease-in-out infinite; }
    .radar { transform-origin:782px 87px; animation:spin 5s linear infinite; }
    .enter { animation:rise 6s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset:-160 } }
    @keyframes pulse { 0%,25%,100% { opacity:.32 } 10% { opacity:1; filter:url(#glow) } }
    @keyframes spin { to { transform:rotate(360deg) } }
    @keyframes rise { 0%,100% { transform:translateY(3px); opacity:.5 } 50% { transform:translateY(-3px); opacity:1 } }
  </style>
  <rect x="1" y="1" width="898" height="308" rx="14" fill="#0D1117" stroke="url(#edge)" stroke-width="2"/>
  <text x="30" y="39" class="mono" font-size="12" letter-spacing="2" fill="#6E7681">FEATURED SIGNAL / 001</text>
  <circle cx="782" cy="87" r="31" stroke="#21262D"/><circle cx="782" cy="87" r="18" stroke="#21262D"/><path class="radar" d="M782 87L808 70A31 31 0 0 1 810 101Z" fill="#39D353" opacity=".25"/>
  <circle cx="782" cy="87" r="3" fill="#7EE787" class="node1"/>
  <text x="30" y="88" class="mono" font-size="30" font-weight="700" fill="#F0F6FC">proxy-pool</text>
  <rect x="30" y="105" width="67" height="24" rx="12" fill="#1F6FEB" fill-opacity=".18" stroke="#388BFD"/>
  <text x="63.5" y="121" text-anchor="middle" class="mono" font-size="11" fill="#79C0FF">PYTHON</text>
  <rect x="106" y="105" width="76" height="24" rx="12" fill="#238636" fill-opacity=".18" stroke="#2EA043"/>
  <text x="144" y="121" text-anchor="middle" class="mono" font-size="11" fill="#7EE787">ACTIVE</text>
  <text x="30" y="161" class="mono" font-size="14" fill="#8B949E">A free proxy service built as a complete acquisition pipeline.</text>
  <text x="30" y="185" class="mono" font-size="14" fill="#8B949E">Crawl, validate, expose, rotate — one compact system.</text>

  <path class="flow" d="M116 244H784" stroke="#238636" stroke-width="1.5"/>
  <g class="node1"><circle cx="116" cy="244" r="19" fill="#161B22" stroke="#7EE787"/><text x="116" y="249" text-anchor="middle" class="mono" font-size="11" fill="#F0F6FC">01</text><text x="116" y="282" text-anchor="middle" class="mono" font-size="11" fill="#6E7681">CRAWL</text></g>
  <g class="node2"><circle cx="338" cy="244" r="19" fill="#161B22" stroke="#58A6FF"/><text x="338" y="249" text-anchor="middle" class="mono" font-size="11" fill="#F0F6FC">02</text><text x="338" y="282" text-anchor="middle" class="mono" font-size="11" fill="#6E7681">VALIDATE</text></g>
  <g class="node3"><circle cx="562" cy="244" r="19" fill="#161B22" stroke="#D2A8FF"/><text x="562" y="249" text-anchor="middle" class="mono" font-size="11" fill="#F0F6FC">03</text><text x="562" y="282" text-anchor="middle" class="mono" font-size="11" fill="#6E7681">HTTP API</text></g>
  <g class="node4"><circle cx="784" cy="244" r="19" fill="#161B22" stroke="#FFA657"/><text x="784" y="249" text-anchor="middle" class="mono" font-size="11" fill="#F0F6FC">04</text><text x="784" y="282" text-anchor="middle" class="mono" font-size="11" fill="#6E7681">ROTATE</text></g>
  <text x="842" y="167" text-anchor="end" class="mono enter" font-size="12" fill="#7EE787">OPEN PROJECT ↗</text>
